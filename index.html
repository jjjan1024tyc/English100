<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語名言語塊">
<title>英文基本100句</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F8;--surface:#FFFFFF;--fg:#14202C;--muted:#566677;--line:#D8E0E9;
  --accent:#1B5BD0;--accent-fg:#FFFFFF;--active:#E4EEFE;--ok:#1E7D45;--warn:#B45309;
  --tF:#1F4E9E;--tC:#2E7D32;--tV:#C25E00;--tP:#8E24AA;
  --hl:#FFE9A6;--hF:#D3E3FF;--hC:#D2F0D7;--hV:#FFE0C0;--hP:#F0D6F8;
  --font-en:'Lexend',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-zh:'Noto Sans TC','PingFang TC','Heiti TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C;--surface:#17212B;--fg:#E7EDF3;--muted:#94A4B4;--line:#26333F;
    --accent:#78A8FF;--accent-fg:#0A1322;--active:#1B2C47;--ok:#5FD08A;--warn:#F2A65A;
    --tF:#8DB4FF;--tC:#7FD38A;--tV:#F5A35B;--tP:#D79BEA;
    --hl:#5C4C12;--hF:#22385F;--hC:#1F4526;--hV:#5B3711;--hP:#47244F;color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-zh);font-size:15px;line-height:1.55;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.hide{display:none!important}

/* 導覽 */
.nav{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}
.nb{height:44px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center;padding:0}
.nb svg{width:22px;height:22px;fill:currentColor}
.nb:disabled{opacity:.3;cursor:default}
.pos{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;font-family:var(--font-en);font-size:15px;font-weight:600;min-width:0;white-space:nowrap}
.pos small{font-family:var(--font-zh);font-weight:400;font-size:13px;color:var(--muted)}
.badge{font-family:var(--font-zh);font-size:12px;font-weight:500;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--warn);border-color:var(--warn)}
h1.ttl{margin:0;text-align:center;font:700 20px/1.2 var(--font-zh);color:var(--fg);letter-spacing:.06em}
.bar{display:flex;gap:8px 12px;align-items:center;justify-content:space-between}
.sum{font-size:13px;color:var(--muted);margin:0}
.sum b{color:var(--fg);font-family:var(--font-en)}
.chip{font-size:14px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* 三階段 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:4px;border-radius:9px;cursor:pointer;min-height:38px;line-height:1.2}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--accent) inset}
.seg button span{display:block;font-size:11px;font-weight:400;opacity:.85}
.help{font-size:13px;color:var(--muted);margin:0}
.help .sw{font-size:inherit}

/* 句子區塊 */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk.on{background:var(--active);border-color:var(--accent)}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lb{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.sp{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:44px;min-width:84px;padding:0 16px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sp svg{width:18px;height:18px;fill:currentColor}
.en{font-family:var(--font-en);font-size:19px;line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.zu{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.zh{font-size:15px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
body.nozh .zh{display:none}
body.nozh .st3 .zh,body.nozh .st4 .zh{display:block}
.en.hid{color:transparent;cursor:pointer;-webkit-user-select:none;user-select:none}
.en.hid .sw{text-decoration-color:var(--fg)}

/* 語塊標示：底色 */
.ck{cursor:pointer;border-radius:4px;padding:1px 3px;margin:0 -1px;background:var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ck-color .ck.tF,.ck-color .bl.tF{background:var(--hF)}
.ck-color .ck.tC,.ck-color .bl.tC{background:var(--hC)}
.ck-color .ck.tV,.ck-color .bl.tV{background:var(--hV)}
.ck-color .ck.tP,.ck-color .bl.tP{background:var(--hP)}
.ck-off .ck{background:none;padding:0;margin:0;cursor:inherit}
.legend{display:none;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--fg)}
.ck-color .legend{display:flex}
.legend span{border-radius:4px;padding:1px 8px}
.legend .tF{background:var(--hF)}.legend .tC{background:var(--hC)}.legend .tV{background:var(--hV)}.legend .tP{background:var(--hP)}
/* 被換掉的字：粗體加實心底線 */
.sw{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

/* 填空：文字隱形，長度與換行都跟原文一樣 */
.bl{cursor:pointer;color:transparent;-webkit-user-select:none;user-select:none;border-bottom:2px solid var(--muted);border-radius:4px 4px 0 0;padding:1px 3px;margin:0 -1px;background:var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.bl.c{border-bottom:0}
.bl.sl{background:var(--active);border-bottom-color:var(--accent);font-weight:700;padding:0;margin:0}
.bl.rv{color:var(--fg);border-bottom-color:var(--accent)}
.bl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ck-off .bl:not(.sl){background:transparent}
.msg{font-size:14px;min-height:20px;margin:0}

.ctl2{display:flex;flex-wrap:nowrap;gap:8px}
.ctl2 button{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;font-weight:500;padding:8px 10px}
.ctl2 .yes{background:var(--ok);border-color:var(--ok);color:#fff}
.ctl2 .no{background:transparent;border-color:var(--warn);color:var(--warn)}
.mark{display:flex;flex-direction:column;gap:8px;padding-top:2px}

/* 設定 */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
summary{cursor:pointer;font-weight:500;font-size:14px;min-height:44px;display:flex;align-items:center}
details .inner{display:flex;flex-direction:column;gap:14px;padding:6px 0 14px}
.row{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:44px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.plain{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.tip-s{font-size:13px;color:var(--muted);margin:0}
#note{display:none;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
#note.show{display:block}

/* 句子總覽 */
#picker{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#picker .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;gap:8px;align-items:center}
.ph input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.cell{font-family:var(--font-en);font-size:16px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0}
.cell.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.cell.no{border-color:var(--warn);color:var(--warn);font-weight:600}
.cell.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.legend2{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rows button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;min-height:48px}
.rows .n{font-family:var(--font-en);color:var(--muted);min-width:2.4em}
.rows .t{font-family:var(--font-en);font-size:15px;overflow-wrap:anywhere;min-width:0}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0}

/* 說明列與底部 */
#tipbar{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:30;display:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
#tipbar.show{display:block}
#tipbar .in{max-width:680px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tipbar b{font-family:var(--font-en)}
#tipbar .l{font-size:12px;opacity:.8}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.d1{display:grid;grid-template-columns:46px 1fr 46px 72px;gap:6px;align-items:center}
.spd{border:1px solid var(--line);background:var(--bg);border-radius:12px;font-family:var(--font-en);font-size:14px;font-weight:500;cursor:pointer;min-height:44px}
.d2{display:grid;grid-template-columns:1fr;gap:8px}
.go{min-height:46px;border-radius:14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.go svg{width:22px;height:22px;fill:currentColor}
@media (prefers-reduced-motion:no-preference){.blk,.bl,.sp{transition:background-color .15s,border-color .15s,color .15s}}
</style>
</head>
<body class="ck-ul">
<div class="wrap">
  <h1 class="ttl">英文基本100句</h1>
  <div class="bar"><p class="sum"><span id="sum"></span> <span class="badge" id="badge" hidden></span></p><button type="button" class="chip" id="review" aria-pressed="false">今日複習</button></div>
  <div id="note" role="status"></div>

  <div class="seg" role="tablist" aria-label="三個階段" id="stages">
    <button type="button" role="tab" data-s="1" aria-checked="true">① 看＋聽</button>
    <button type="button" role="tab" data-s="2" aria-checked="false">② 遮語塊</button>
    <button type="button" role="tab" data-s="3" aria-checked="false">③ 換名詞</button>
    <button type="button" role="tab" data-s="4" aria-checked="false">④ 中翻英</button>
  </div>
  <div class="legend"><span class="tF">句型框架</span><span class="tC">搭配詞</span><span class="tV">動詞片語</span><span class="tP">固定表達／諺語</span></div>

  <main id="stage"></main>

  <details>
    <summary>更多設定</summary>
    <div class="inner">
      <div class="row">
        <div class="lbl">朗讀聲音</div>
        <div class="seg" role="radiogroup" aria-label="聲音：女聲、男聲或輪流" id="gender">
        <button type="button" role="radio" data-g="f" aria-checked="true">女聲</button>
        <button type="button" role="radio" data-g="m" aria-checked="false">男聲</button>
        <button type="button" role="radio" data-g="b" aria-checked="false">女男輪流</button>
      </div>
      </div>
      <div class="row">
        <div class="lbl">語塊標示</div>
        <div class="seg" role="radiogroup" aria-label="語塊標示" id="ck">
          <button type="button" role="radio" data-c="ul" aria-checked="true">單色底色</button>
          <button type="button" role="radio" data-c="color" aria-checked="false">依類型配色</button>
          <button type="button" role="radio" data-c="off" aria-checked="false">關閉</button>
        </div>
      </div>
      <div class="row">
        <div class="lbl"><label for="gap">連播時的停頓（可用來跟讀）</label></div>
        <select id="gap"><option value="0.5">0.5 秒</option><option value="1">1 秒</option><option value="2">2 秒</option><option value="3">3 秒</option></select>
      </div>
      <label class="check"><input type="checkbox" id="zh" checked> 顯示中文（第③④階段一定會顯示）</label>
      <div class="row">
        <div class="lbl">離線音檔</div>
        <button type="button" class="plain" id="dlAll">預先下載全部音檔（約 15 MB）</button>
        <p class="tip-s" id="dlMsg">音檔播過一次就會存在這台裝置，之後不用再下載。想一次下載完，可以按上面的按鈕，建議在有 Wi-Fi 時做。</p>
      </div>
      <div class="row">
        <div class="lbl">學習紀錄</div>
        <button type="button" class="plain" id="clear">清除這台裝置上的學習紀錄</button>
        <p class="tip-s">學習紀錄只存在這台裝置的瀏覽器裡。請不要用無痕瀏覽，也不要清除網站資料，否則紀錄會消失。</p>
      </div>
      <p class="tip-s"><b>沒聲音時：</b>先檢查側邊靜音鍵與音量。</p>
    </div>
  </details>
</div>

<div id="picker" role="dialog" aria-label="選擇句子" hidden>
  <div class="in">
    <div class="ph"><input type="search" id="search" placeholder="搜尋英文單字或中文" aria-label="搜尋句子"><button type="button" class="chip" id="pclose">關閉</button></div>
    <div class="legend2"><span style="color:var(--ok)">■ 已會</span><span style="color:var(--warn)">■ 還不熟</span><span>□ 尚未練習</span></div>
    <div class="grid" id="grid"></div>
    <ul class="rows" id="rows" hidden></ul>
    <p class="empty" id="empty" hidden>找不到符合的句子。</p>
  </div>
</div>

<div id="tipbar" role="status"><div class="in" id="tipin"></div></div>

<div class="dock">
  <div class="in">
    <div class="d1">
  
      <button type="button" class="nb" id="prev" aria-label="上一句"><svg viewBox="0 0 24 24"><path d="M15.4 5 8.4 12l7 7 1.6-1.6L11.6 12l5.4-5.4z"/></svg></button>
      <button type="button" class="pos" id="pos" aria-haspopup="dialog"><span id="posTxt"></span><small>▾</small></button>
      <button type="button" class="nb" id="next" aria-label="下一句"><svg viewBox="0 0 24 24"><path d="m8.6 5-1.6 1.6L12.4 12 7 17.4 8.6 19l7-7z"/></svg></button>
  
      <button type="button" class="spd" id="spd" aria-label="語速">0.9×</button>
    </div>
    <div class="d2">
      <button type="button" class="go" id="play"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="icoPause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span id="playTxt">連播三句</span></button>
    </div>
  </div>
</div>

 hard thing {F|makes it impossible|make + it + adj}.","x":[["Putting off a small job makes it hard. Putting off a big job makes it impossible.","把小事拖著不做，會讓它變困難；把大事拖著不做，會讓它變得不可能完成。"],["Putting off easy homework makes it hard. Putting off hard homework makes it impossible.","把簡單的功課拖著不做，會讓它變困難；把困難的功課拖著不做，會讓它變得不可能完成。"]],"u":[["簡單的事","困難的事"],["小事","大事"],["簡單的功課","困難的功課"]]},{"e":"The only good luck many great men ever had was being born with the ability to overcome bad luck.","z":"許多偉人唯一的好運，就是天生具備克服厄運的能力。","m":"The only good luck many great men ever had was {V|being born with|be born with + N} the {C|ability to|ability to + V} {V|overcome|overcome + N} bad luck.","x":[["The only good luck many great artists ever had was being born with the ability to overcome fear.","許多偉大的藝術家唯一的好運，就是天生具備克服恐懼的能力。"],["The only good luck many top players ever had was being born with the ability to overcome pain.","許多頂尖球員唯一的好運，就是天生具備克服痛苦的能力。"]],"u":[["許多偉人","唯一的好運","厄運"],["藝術家","恐懼"],["頂尖球員","痛苦"]]},{"e":"The greatest discovery of our generation is that a human being can alter his life by altering his attitudes.","z":"我們這一代最偉大的發現是：人可以藉由改變態度來改變自己的人生。","m":"{F|The greatest discovery of our generation is that|The + 最高級 + N + is that + S V} a human being can alter his life {F|by altering|by + V-ing} his attitudes.","x":[["The greatest discovery of our generation is that a student can change his future by altering his habits.","我們這一代最偉大的發現，就是學生可以藉由改變習慣來改變自己的未來。"],["The greatest discovery of our generation is that a person can improve his health by altering his diet.","我們這一代最偉大的發現，就是人可以藉由改變飲食來改善自己的健康。"]],"u":[["人","改變","人生","態度"],["學生","改變自己的未來"],["人","改善","健康"]]},{"e":"It is not what happens to you; it is what you do with what happens to you.","z":"重要的不是在你身上發生了什麼，而是你如何應對發生在你身上的事。","m":"{F|It is not|It is not A; it is B} what happens to you; {F|it is|It is not A; it is B} what you do with what happens to you.","x":[["It is not what you have; it is what you do with what you have.","重要的不是你擁有什麼，而是你如何運用你所擁有的。"],["It is not how fast you run; it is how long you keep running.","重要的不是你跑得多快，而是你能持續跑多久。"]],"u":[["發生了","發生在"],[],["多快","持續跑多久"]]},{"e":"It is not what other people think of you, it is what you think of yourself that counts.","z":"重要的不是別人怎麼看你，而是你怎麼看待自己。","m":"{F|It is not|It is not A, it is B} what other people {V|think of|think of} you, {F|it is|It is not A, it is B} what you think of yourself that counts.","x":[["It is not what teachers think of you, it is what you think of yourself that counts.","重要的不是老師怎麼看你，而是你怎麼看自己。"],["It is not what people think of your grades, it is what you think of your effort that counts.","重要的不是別人怎麼看你的成績，而是你怎麼看待自己的努力。"]],"u":[["別人","自己"],["老師"],["成績","努力"]]},{"e":"As long as you are dreaming, believing, and doing, you can go anywhere and achieve anything.","z":"只要你有夢想、有信念、有行動，你就可以無往不利，無所不勝。","m":"{F|As long as|as long as + S + V (只要)} you are dreaming, believing, and doing, you can go anywhere and achieve anything.","x":[["As long as you are reading, writing, and speaking, you can learn any language.","只要你持續閱讀、寫作和開口說，你就能學會任何一種語言。"],["As long as you are studying, practicing, and improving, you can go anywhere.","只要你不斷學習、練習和進步，你就能去任何地方。"]],"u":[["夢想","信念","行動","無往不利","無所不勝"],["閱讀","開口說","語言"],["學習","練習","進步"]]},{"e":"Whatever you do, do it whole-heartedly.","z":"無論你做什麼，都要全心全意地做。","m":"{F|Whatever you do|Whatever + S + V, ...}, do it whole-heartedly.","x":[["Whatever you do, do it with a smile.","無論你做什麼，都要面帶微笑去做。"],["Whatever you do, do your homework carefully.","無論你做什麼，都要認真寫功課。"]],"u":[["全心全意"],["微笑"],["認真寫功課"]]},{"e":"Success is how high you bounce when you hit bottom.","z":"成功就是你跌到谷底後，能反彈多高。","m":"Success is {F|how high you bounce|how + adj + S + V (名詞子句)} when you {P|hit bottom|hit bottom (跌到谷底)}.","x":[["Courage is how high you bounce when you hit bottom.","勇氣就是你跌到谷底後能彈得多高。"],["Hope is how high you bounce when you hit bottom.","希望就是你跌到谷底後能彈得多高。"]],"u":[["成功"],["勇氣"],["希望"]]},{"e":"Success is measured not by how much money you have made, but by how many people you have helped.","z":"衡量成功的標準不是看你賺了多少錢，而是看你幫助了多少人。","m":"Success {V|is measured|be measured by} {F|not by|not by A but by B} how much money you have made, {F|but by|not by A but by B} how many people you have helped.","x":[["A good school is measured not by how big its buildings are, but by how happy its students are.","衡量一所好學校，不是看校舍有多大，而是看學生有多快樂。"],["A friend is measured not by how many gifts he gives, but by how often he listens.","衡量一位朋友，不是看他送了多少禮物，而是看他多常傾聽。"]],"u":[["成功","賺了多少錢","幫助了多少人"],["好學校","校舍","學生"],["朋友","禮物","傾聽"]]},{"e":"Great works are performed not by strength, but by perseverance.","z":"完成偉大的事業不在於體力，而在於堅忍不拔的毅力。","m":"Great works are performed {F|not by|not by A, but by B} strength, {F|but by|not by A, but by B} perseverance.","x":[["Good grades are earned not by luck, but by effort.","好成績不是靠運氣得來的，而是靠努力。"],["Great teams are built not by stars, but by working together.","優秀的團隊不是靠明星打造的，而是靠大家一起努力。"]],"u":[["完成","偉大的事業","體力","堅忍不拔的毅力"],["好成績","得來","努力"],["團隊","打造","一起努力"]]},{"e":"Man is not judged by his words, but by his deeds.","z":"評斷一個人，不是看他說了什麼，而是看他做了什麼。","m":"Man {F|is not judged by|not (judged) by A, but by B} his words, {F|but by|not (judged) by A, but by B} his deeds.","x":[["A student is not judged by his grades, but by his effort.","評斷一位學生，不是看他的成績，而是看他的努力。"],["A team is not judged by its size, but by its spirit.","評斷一支隊伍，不是看它的規模，而是看它的精神。"]],"u":[["人","說了什麼","做了什麼"],["學生","成績","努力"],["隊伍","規模","精神"]]},{"e":"No one can humiliate or disturb us unless we let him.","z":"沒有任何人能侮辱我們、困擾我們，除非我們自己允許。","m":"{F|No one can|No one can V unless + S V} humiliate or disturb us {F|unless|unless + S + V (除非)} we {V|let him|let + sb. + V}.","x":[["No one can stop us unless we let him.","除非我們自己允許，否則沒有人能阻止我們。"],["No one can fool you unless you let him.","除非你自己允許，否則沒有人能愚弄你。"]],"u":[["侮辱","困擾我們"],["阻止"],["愚弄"]]},{"e":"No one can make you feel inferior without your consent.","z":"沒有你的同意，沒有人能讓你自卑。","m":"{F|No one can|No one can V ...} e most + adj + N + is + V-ing} {C|knowing how to|know how to + V} {V|get along with|get along with + sb.} people.","x":[["The most important single ingredient in the formula of success is knowing how to get along with classmates.","成功公式中最重要的單一要素，就是懂得如何與同學相處。"],["The most important single ingredient in the formula of success is knowing how to get along with neighbors.","成功公式中最重要的單一要素，就是懂得如何與鄰居相處。"]],"u":[["人"],["同學"],["鄰居"]]},{"e":"Success is not measured by the position you reach in life; it's measured by the obstacles you overcome.","z":"成功不是用你一生取得的地位來衡量的，而是看你克服了多少障礙。","m":"Success {F|is not measured by|not measured by A; measured by B} the position you reach in life; it's {F|measured by|not measured by A; measured by B} the {C|obstacles you overcome|overcome obstacles}.","x":[["Success is not measured by the prize you win; it's measured by the obstacles you overcome.","成功不是用你贏得的獎項來衡量，而是看你克服了多少障礙。"],["Power is not measured by the weight you lift; it's measured by the obstacles you overcome.","力量不是用你舉起的重量來衡量，而是看你克服了多少障礙。"]],"u":[["成功","地位","取得","一生"],["獎項","贏得"],["力量","重量","舉起"]]},{"e":"It is in your moments of decision that your destiny is shaped.","z":"你的命運，取決於你做決定的那一刻。","m":"{F|It is in your moments of decision that|It is + 強調部分 + that (強調句)} your destiny is shaped.","x":[["It is in your moments of decision that your character is shown.","你的品格，展現在你做決定的那一刻。"],["It is in your moments of decision that your habits are formed.","你的習慣，是在你做決定的那一刻養成的。"]],"u":[["命運","取決於"],["品格","展現"],["習慣","養成"]]},{"e":"The surest way not to fail is to determine to succeed.","z":"避免失敗最可靠的方法，就是下定決心成功。","m":"{F|The surest way not to fail is to|The way to V is to V} {V|determine to|determine to + V} succeed.","x":[["The surest way not to fail is to determine to practice every day.","不失敗最可靠的方法，就是下定決心每天練習。"],["The surest way not to fail is to determine to finish your homework.","不失敗最可靠的方法，就是下定決心把功課寫完。"]],"u":[["成功"],["每天練習"],["把功課寫完"]]},{"e":"What would life be if we had no courage to attempt anything?","z":"如果我們對任何事情都沒有勇氣嘗試，人生還有什麼意義？","m":"{F|What would life be if we had|What would S be if S had ... (與現在事實相反的假設)} no {C|courage to|courage to + V} attempt anything?","x":[["What would life be if we had no courage to speak?","如果我們沒有開口說話的勇氣，人生會是什麼樣子？"],["What would life be if we had no courage to try new food?","如果我們沒有嘗試新食物的勇氣，人生會是什麼樣子？"]],"u":[["任何事情","嘗試"],["開口說話"],["嘗試新食物"]]},{"e":"The world belongs to the energetic.","z":"世界屬於充滿活力的人。","m":"The world {V|belongs to|belong to} {C|the energetic|the + adj (…的人)}.","x":[["The morning belongs to the energetic.","早晨屬於充滿活力的人。"],["The stage belongs to the energetic.","舞台屬於充滿活力的人。"]],"u":[["世界"],["早晨"],["舞台"]]},{"e":"Early to bed and early to rise keeps a man healthy, wealthy and wise.","z":"早睡早起，使人健康、富足又有智慧。","m":"{P|Early to bed and early to rise keeps a man healthy, wealthy and wise|諺語}.","x":[["My grandfather goes to bed at nine. He says, \"Early to bed and early to rise keeps a man healthy, wealthy and wise.\"","我爺爺九點就上床睡覺。他說：「早睡早起，使人健康、富足又有智慧。」"],["Sleep early before the exam. Remember: Early to bed and early to rise keeps a man healthy, wealthy and wise.","考試前要早點睡。記住：早睡早起，使人健康、富足又有智慧。"]],"u":[[],["爺爺","九點","說"],["早點睡","考試前","記住"]]},{"e":"The human will can be strengthened like a muscle!","z":"人的意志可以像肌肉一樣被鍛鍊強化。","m":"The human will {F|can be strengthened|can be + p.p. (被動)} {F|like a muscle|like + N (比喻)}!","x":[["Memory can be strengthened like a muscle.","記憶力可以像肌肉一樣被鍛鍊強化。"],["Your English can be strengthened like a muscle.","你的英文可以像肌肉一樣被鍛鍊強化。"]],"u":[["人"],["記憶力"],["英文"]]},{"e":"Success grows out of the struggle to overcome difficulties.","z":"成功來自於克服困難的奮鬥。","m":"Success {V|grows out of|grow out of (源自)} the {C|struggle to|struggle to + V} {C|overcome difficulties|overcome difficulties}.","x":[["Courage grows out of the struggle to overcome difficulties.","勇氣來自克服困難的奮鬥。"],["Friendship grows out of the struggle to overcome difficulties.","友誼來自克服困難的奮鬥。"]],"u":[["成功"],["勇氣"],["友誼"]]},{"e":"Each day, take at least one step toward your goal. The step doesn't have to be big, moving forward even a small amount is progress.","z":"每天至少朝目標邁進一步。這一步不一定要很大，就算只前進一點點，也是進步。","m":"Each day, {C|take at least one step toward|take a step toward} your goal. The step {F|doesn't have to|don't have to + V (不必)} be big, {C|moving forward|move forward} even a small amount is progress.","x":[["Every week, take at least one step toward your dream. The plan doesn't have to be perfect, moving forward even a little is progress.","每週至少朝你的夢想邁進一步。計畫不必完美，只要往前走一點點，就是進步。"],["Each day, take at least one step toward better health. The exercise doesn't have to be long, moving forward even a little is progress.","每天至少朝更健康的目標邁進一步。運動不必很久，只要往前走一點點，就是進步。"]],"u":[["每天","目標","這一步","很大","就算","一點點"],["每週","完美","一點點"],["更健康","運動","一點點"]]},{"e":"Remind yourself to laugh and smile. You can always make room for happiness.","z":"提醒自己要開懷大笑、微笑。你總能為快樂騰出空間。","m":"{V|Remind yourself to|remind sb. to + V} laugh and smile. You can always {C|make room for|make room for + N} happiness.","x":[["Remind yourself to rest. You can always make room for friends.","提醒自己要休息。你總是能為朋友留出空間。"],["Remind yourself to read. You can always make room for music.","提醒自己要閱讀。你總是能為音樂留出空間。"]],"u":[["開懷大笑","微笑","總能","快樂"],["休息","朋友"],["閱讀","音樂"]]},{"e":"Everyone is important. Anyone can change the world. No one should underestimate his power!","z":"人人都很重要。任何人都能改變世界。沒有人應該低估自己的力量！","m":"Everyone is important. Anyone can {C|change the world|change the world}. {F|No one should|No one should + V} underestimate his power!","x":[["Even a child can change the world. No one should laugh at his dream.","就連小孩也能改變世界。沒有人應該嘲笑他的夢想。"],["A small kind act can change the world. No one should ignore it.","一個小小的善行就能改變世界。沒有人應該忽視它。"]],"u":[["人人","重要","任何人","低估","力量"],["小孩","嘲笑","夢想"],["小小的善行","忽視"]]},{"e":"Only a fool criticizes what he does not understand.","z":"只有傻瓜才會批評自己不懂的事。","m":"Only a fool criticizes {F|what he does not understand|what + S + V (名詞子句)}.","x":[["Only a fool laughs at what he does not understand.","只有傻瓜才會嘲笑自己不懂的事。"],["Only a fool fears what he does not understand.","只有傻瓜才會害怕自己不懂的事。"]],"u":[["只有","傻瓜才會批評"],["嘲笑"],["害怕"]]},{"e":"You don't need an invitation to help others. Help before you are asked.","z":"幫助別人是不需要邀請的。在別人開口之前就伸出援助之手吧！","m":"{F|You don't need an invitation to|need an invitation to + V} help others. Help {F|before|before + S + V} you are asked.","x":[["You don't need an invitation to share your lunch. Offer before you are asked.","分享午餐不需要邀請。在別人開口之前就主動提供吧。"],["You don't need an invitation to clean the classroom. Start before you are asked.","打掃教室不需要邀請。在別人開口之前就動手吧。"]],"u":[["幫助別人","伸出援助之手","開口"],["分享","午餐","主動提供"],["打掃","教室","動手"]]},{"e":"Push yourself to do more than others believe you can do. Then, encourage others to push themselves just as hard.","z":"督促自己做到比別人以為你能做的更多。接著，鼓勵別人也同樣努力督促自己。","m":"{V|Push yourself to|push oneself to + V} do more than others believe you can do. Then, {V|encourage others to|encourage sb. to + V} push themselves {F|just as hard|as + adv + as}.","x":[["Push yourself to read more than your teacher expects. Then, encourage others to read just as hard.","逼自己讀得比老師期待的更多。接著，鼓勵別人也同樣用功閱讀。"],["Push yourself to practice more than your teacher expects. Then, encourage others to practice just as hard.","逼自己練習得比老師期待的更多。接著，鼓勵別人也同樣努力練習。"]],"u":[["更多","別人以為","努力督促自己"],["讀","老師期待","閱讀"],["練習","老師期待","努力練習"]]},{"e":"The future belongs to those who believe in the beauty of their dreams.","z":"未來屬於那些相信夢想之美的人。","m":"The future {V|belongs to|belong to} {F|those who|those who + V (…的人)} {V|believe in|believe in + N} the beauty of their dreams.","x":[["The prize belongs to those who believe in working together.","獎項屬於相信大家一起努力的人。"],["The future belongs to those who believe in the power of reading.","未來屬於相信閱讀力量的人。"]],"u":[["未來","夢想之美"],["獎項","大家一起努力"],["閱讀力量"]]},{"e":"Harsh advice is the most instructive.","z":"忠言逆耳利於行。","m":"Harsh advice is {F|the most instructive|the most + adj}.","x":[["Experience is the most instructive teacher.","經驗是最具啟發性的老師。"],["Failure is the most instructive teacher.","失敗是最具啟發性的老師。"]],"u":[["忠言逆耳"],["經驗","老師"],["失敗","老師"]]},{"e":"Don't wait for the world to change. Change it yourself.","z":"不要等待世界改變。去改變世界吧！","m":"Don't {V|wait for the world to change|wait for + sb. + to V}. Change it yourself.","x":[["Don't wait for the world to change. Start with your own class.","別等著世界改變。從你自己的班級開始吧。"],["Don't wait for the world to change. Start with your own room.","別等著世界改變。從你自己的房間開始吧。"]],"u":[["不要","改變世界"],["開始","自己的班級"],["開始","自己的房間"]]},{"e":"The only true failure is the failure to try.","z":"唯一真正的失敗是沒有去嘗試。","m":"{F|The only|The only + N + is ...} true failure is the {C|failure to|failure to + V} try.","x":[["The only real mistake is the failure to ask.","唯一真正的錯誤，就是不開口提問。"],["The only true weakness is the failure to listen.","唯一真正的弱點，就是不願傾聽。"]],"u":[["真正的失敗","嘗試"],["真正的錯誤","提問"],["弱點","傾聽"]]},{"e":"Nothing great was ever achieved without enthusiasm.","z":"沒有熱情，就成就不了偉大的事。","m":"{F|Nothing great was ever achieved without|Nothing + p.p. + without + N (沒有…就沒有…)} enthusiasm.","x":[["Nothing great was ever achieved without help.","沒有別人的幫助，就成就不了任何偉大的事。"],["Nothing great was ever achieved without practice.","沒有練習，就成就不了任何偉大的事。"]],"u":[["熱情"],["別人的幫助"],["練習"]]},{"e":"There is no challenge more challenging than improving yourself.","z":"沒有什麼挑戰比提升自己更具挑戰性。","m":"{F|There is no challenge more challenging than|There is no + N + 比較級 + than ...} improving yourself.","x":[["There is no challenge more challenging than speaking in public.","沒有什麼挑戰比公開演說更具挑戰性。"],["There is no challenge more challenging than waking up early.","沒有什麼挑戰比早起更具挑戰性。"]],"u":[["提升自己"],["公開演說"],["早起"]]},{"e":"Confidence is contagious. So is lack of confidence.","z":"自信會傳染，缺乏自信也一樣。","m":"Confidence is contagious. {F|So is|So + be/助動詞 + S (…也一樣)} {C|lack of|lack of + N} confidence.","x":[["Kindness is contagious. So is lack of kindness.","善意會傳染，缺乏善意也一樣。"],["Excitement is contagious. So is lack of interest.","興奮會傳染，缺乏興趣也一樣。"]],"u":[["自信","傳染","缺乏自信"],["善意","缺乏善意"],["興奮","缺乏興趣"]]},{"e":"Confidence is half of victory.","z":"自信就是成功的一半。","m":"Confidence {F|is half of|X is half of Y} victory.","x":[["Planning is half of success.","規劃好就成功了一半。"],["Listening is half of learning.","傾聽是學習的一半。"]],"u":[["自信","成功"],["規劃","成功"],["傾聽","學習"]]},{"e":"Attitude is just as important as ability.","z":"態度和能力一樣重要。","m":"Attitude is {F|just as important as|as + adj + as} ability.","x":[["Sleep is just as important as study.","睡眠和讀書一樣重要。"],["Health is just as important as grades.","健康和成績一樣重要。"]],"u":[["態度","能力"],["睡眠","讀書"],["健康","成績"]]},{"e":"You're unique with special gifts; use them.","z":"你是獨一無二的，擁有獨特的才能。好好發揮吧！","m":"You're unique {C|with special gifts|with + N (具有…)}; use them.","x":[["Every child is born with special gifts; teachers should help them grow.","每個孩子天生都有特別的天賦；老師應該幫助他們成長。"],["My sister is born with special gifts; she uses them well.","我姊姊天生就有特別的天賦，而且她把天賦運用得很好。"]],"u":[["你是獨一無二","好好發揮"],["每個孩子","天生","老師應該幫助"],["姊姊","天生","運用"]]},{"e":"We're all capable if we have faith and passion.","z":"只要我們有信念、有熱情，我們就都有能力。","m":"We're all capable {F|if we have|if + S + V (條件句)} faith and passion.","x":[["We can all learn if we have time and courage.","只要有時間和勇氣，我們都能學會。"],["We're all strong if we have friends and hope.","只要有朋友和希望，我們都很堅強。"]],"u":[["信念","熱情","能力"],["時間","勇氣","學會"],["朋友","希望","堅強"]]},{"e":"Diligence is the mother of good luck.","z":"勤奮是好運之母。","m":"Diligence {F|is the mother of|X is the mother of Y} {C|good luck|good luck}.","x":[["Hard work is the mother of good luck.","努力是好運之母。"],["Practice is the mother of good luck.","練習是好運之母。"]],"u":[["勤奮"],["努力"],["練習"]]},{"e":"If you are doing your best, you will not have to worry about failure.","z":"如果你盡力而為，你就不必擔憂失敗。","m":"{F|If you are doing your best, you will|If + S + V, S will V (條件句)} {C|not have to|not have to + V} {V|worry about|worry about + N} failure.","x":[["If you are doing your best, you will not have to worry about grades."," function parse(m) {
  var segs = [], pos = 0, r;
  PAT.lastIndex = 0;
  while ((r = PAT.exec(m))) {
    if (r.index > pos) segs.push({ t: null, x: m.slice(pos, r.index) });
    segs.push({ t: r[1], x: r[2], l: r[3] || r[2] });
    pos = PAT.lastIndex;
  }
  if (pos < m.length) segs.push({ t: null, x: m.slice(pos) });
  return segs;
}

function exampleSegs(text, d) {

    var re = new RegExp('(^|[^A-Za-z\'])(' + esc(c.x) + ')(?![A-Za-z\'])', 'gi'), m;
    while ((m = re.exec(text))) {
      var st = m.index + m[1].length, en = st + m[2].length;
      if (spans.every(function (q) { return en <= q.s || st >= q.e; })) spans.push({ s: st, e: en, c: c });
      re.lastIndex = st + 1;
    }

  var out = [], pos = 0;
  spans.forEach(function (q) {
    if (q.s > pos) out.push({ k: 'gap', x: text.slice(pos, q.s) });
    out.push({ k: 'ck', x: text.slice(q.s, q.e), t: q.c.t, l: q.c.l });
    pos = q.e;

function exParts(text, d) {

    while ((m = re.exec(s.x))) {
      var w = m[0].toLowerCase(), sw = !d.ow[w] && !d.ow['~' + w.slice(0, 4)] && !STOP[w] && !d.isP;
      var g = s.x.slice(pos, m.index);

        else { if (g) parts.push({ k: 'txt', x: g }); cur = { k: 'slot', x: m[0] }; parts.push(cur); }
      } else { cur = null; if (g + m[0]) parts.push({ k: 'txt', x: g + m[0] }); }
      pos = re.lastIndex;
    }
    if (pos < s.x.length) parts.push({ k: 'txt', x: s.x.slice(pos) });
  });

  if (sl.length > 3) {
    var keep = sl.slice().sort(function (a, b) { return b.x.length - a.x.length; }).slice(0, 3);
    parts.forEach(function (p) { if (p.k === 'slot' && keep.indexOf(p) < 0) p.k = 'txt'; });

function origParts(d) {

    while ((m = re.exec(s.x))) {

        if (cur && /^\s+$/.test(g)) cur.x += g + m[0];
        else { if (g) parts.push({ k: 'txt', x: g }); cur = { k: 'slot', x: m[0] }; parts.push(cur); }
      } else { cur = null; if (g + m[0]) parts.push({ k: 'txt', x: g + m[0] }); }

}
function toggleBlank(b) { b.classList.toggle('rv'); }
stageEl.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('.bl'); if (b) toggleBlank(b); });
stageEl.addEventListener('keydown', function (e) {
  var b = e.target.closest && e.target.closest('.bl');
  if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleBlank(b); }
});
function revealCtl() {
  var on = false;
  var ab = btn('', '全部看答案', function () {
    on = !on;
    Array.prototype.forEach.call(stageEl.querySelectorAll('.bl'), function (b) { b.classList.toggle('rv', on); });
    Array.prototype.forEach.call(stageEl.querySelectorAll('.en'), function (e) { e.classList.toggle('hid', !on); });
    ab.textContent = on ? '全部蓋住' : '全部看答案';
  });
  return ab;
}

/* 第③階段：語塊保留，被換掉的字蓋住，口說自評 */
function buildStage3(d, box) {
  var n = 0;
  box.appendChild(lineBlock(0, d, function (e) {
    origParts(d).forEach(function (p) {
      if (p.k === 'ck') e.appendChild(chunkSpan({ t: p.t, x: p.x, l: p.l }));
      else if (p.k === 'slot') { n++; e.appendChild(blank(p.x, 'sl')); }
      else e.appendChild(document.createTextNode(p.x));
    });
  }));
  [1, 2].forEach(function (k) {
    box.appendChild(lineBlock(k, d, function (e) {
      exParts(d.x[k - 1][0], d).forEach(function (p) {
        if (p.k === 'ck') e.appendChild(chunkSpan({ t: p.t, x: p.x, l: p.l }));
        else if (p.k === 'slot') { n++; e.appendChild(blank(p.x, 'sl')); }
        else e.appendChild(document.createTextNode(p.x));
      });
    }));
  });
  if (!n) {
    box.appendChild(el('p', 'help', d.isP ? '這是整句固定說法，不用換字。請看例句，直接念出來。' : '這句沒有蓋住的字，請直接聽、念。'));
    return null;
  }
  return revealCtl();
}
function finish(ok) {
  var i = S.idx; mark(i, ok); stopChain();
  if (S.review) {
    var dl = dueList().filter(function (n) { return n > i; });
    if (dl.length) { go(dl[0]); note('已記錄。', 1500); return; }
    S.review = false; paintReview(); note('今天的複習到這裡，辛苦了！', 3000); return;
  }
  if (i < D.length - 1) { go(i + 1); note('已記錄。', 1500); }
  else note('已記錄。100 句都練完囉！', 3000);
}
function go(n) {
  if (n < 0 || n >= D.length) return;
  stopChain(); S.idx = n; S.stage = 1; S.tag = '';
  persist(); render(); paintNav(); hideTip(); window.scrollTo(0, 0);
  prefetchSentence(S.idx); prefetchSentence(S.idx + 1);
}
function stepTo(d) {
  var list = S.review ? dueList() : null;
  if (list) {
    var c = list.filter(function (n) { return d > 0 ? n > S.idx : n < S.idx; });
    if (!c.length) { note(d > 0 ? '已經是最後一句待複習了。' : '已經是第一句待複習了。', 1800); return; }
    go(d > 0 ? c[0] : c[c.length - 1]);
  } else go(S.idx + d);
}
function paintStageTabs() { Array.prototype.forEach.call($('stages').querySelectorAll('button'), function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-s') === String(S.stage))); }); }
function paintNav() {
  var i = S.idx, p = P[i + 1];
  $('posTxt').textContent = '第 ' + (i + 1) + ' / ' + D.length + ' 句';
  var bd = $('badge');
  bd.hidden = !p; bd.className = 'badge' + (!p ? '' : p.b >= 1 ? ' ok' : ' no'); bd.textContent = !p ? '' : p.b >= 1 ? '✓ 會了' : '還不熟';
  $('prev').disabled = !S.review && i <= 0; $('next').disabled = !S.review && i >= D.length - 1;
}
function paintReview() { $('review').classList.toggle('on', S.review); $('review').setAttribute('aria-pressed', String(S.review)); paintNav(); }

/* ---------- 音訊 ---------- */
var au = new Audio(); au.preload = 'auto';
try { au.preservesPitch = true; au.webkitPreservesPitch = true; } catch (e) {}
var blobURL = '';
function pad3(n) { return ('00' + n).slice(-3); }
function clipURL(i, part, tag) { return 'audio/' + part + pad3(i + 1) + (tag || '') + '.mp3'; }
var wl = null;
function wake() { try { if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }, function () {}); } catch (e) {} }
function unwake() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
function paintPlay() {
  $('icoPlay').hidden = S.playing; $('icoPause').hidden = !S.playing;
  $('playTxt').textContent = S.playing ? '暫停' : '連播三句';
  blocks.forEach(function (b, k) { b.classList.toggle('on', S.playing && b && (k === 0 ? '' : k === 1 ? 'a' : 'b') === S.tag); });
}
function stopChain() { S.token++; clearTimeout(S.timer); S.chain = []; try { au.pause(); } catch (e) {} S.playing = false; paintPlay(); unwake(); }
function fail(t) { if (t !== S.token) return; stopChain(); note('音檔載入失敗。請確認網路連線與靜音鍵，再按一次播放。'); }
function startPlay(t) {
  au.playbackRate = S.rate;
  var pr = au.play();
  if (pr && pr.catch) pr.catch(function (e) {
    if (t !== S.token) return;
    if (e && e.name === 'NotAllowedError') { stopChain(); note('瀏覽器擋住自動播放，請再點一次播放。'); }
  });
}
var cache = {};
/* 音檔只下載一次：存進瀏覽器的 Cache Storage，之後直接從本機讀 */
var CACHE_NAME = 'quotes-audio-v1';
var cstore = null;
function openStore() {
  if (!cstore) cstore = (window.caches ? caches.open(CACHE_NAME) : Promise.reject(0)).catch(function () { return null; });
  return cstore;
}
function loadClip(url) {
  return openStore().then(function (c) {
    if (!c) return fetch(url).then(function (r) { if (!r.ok) throw 0; return r; });
    return c.match(url).then(function (hit) {
      if (hit) return hit;
      return fetch(url).then(function (r) {
        if (!r.ok) throw 0;
        try { c.put(url, r.clone()).catch(function () {}); } catch (e) {}
        return r;
      });
    });
  }).then(function (r) { return r.blob(); }).then(function (b) { return URL.createObjectURL(b); });
}
function prefetch(url) {
  if (cache[url]) return; cache[url] = 'p';
  loadClip(url).then(function (u) { cache[url] = u; }).catch(function () { delete cache[url]; });
}
function prefetchSentence(i) {
  if (i < 0 || i >= D.length) return;
  (S.gender === 'b' ? ['f', 'm'] : [S.gender]).forEach(function (p) { ['', 'a', 'b'].forEach(function (g) { prefetch(clipURL(i, p, g)); }); });
}
function playClip(i, tag) {
  clearTimeout(S.timer); S.token++;
  var t = S.token, part;
  if (S.gender === 'b') { part = S.turn; S.turn = S.turn === 'f' ? 'm' : 'f'; } else part = S.gender;
  S.tag = tag; S.playing = true; note(''); paintPlay();
  var url = clipURL(i, part, tag), retried = false; S.url = url;
  au.onended = function () {
    if (t !== S.token) return;
    if (S.chain.length) {
      var nx = S.chain.shift();
      S.timer = setTimeout(function () { if (t === S.token) playClip(S.idx, nx); }, S.gap * 1000);
    } else { S.playing = false; paintPlay(); unwake(); }
  };
  au.onerror = function () {
    if (t !== S.token) return;
    if (retried) { fail(t); return; }
    retried = true;
    fetch(url).then(function (r) { if (!r.ok) throw new Error('http'); return r.blob(); }).then(function (b) {
      if (t !== S.token) return;
      if (blobURL) URL.revokeObjectURL(blobURL);
      blobURL = URL.createObjectURL(b); au.src = blobURL; startPlay(t);
    }).catch(function () { fail(t); });
  };
  au.src = (cache[url] && cache[url] !== 'p') ? cache[url] : url; startPlay(t); wake();
}

/* ---------- 句子總覽 ---------- */
var gridEl = $('grid'), rowsEl = $('rows'), pickerEl = $('picker');
function openPicker() {
  gridEl.innerHTML = '';
  for (var i = 0; i < D.length; i++) (function (i) {
    var p = P[i + 1];
    var b = btn('cell' + (i === S.idx ? ' cur' : p ? (p.b >= 1 ? ' ok' : ' no') : ''), String(i + 1), function () { closePicker(); S.review = false; paintReview(); go(i); });
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 句' + (p ? (p.b >= 1 ? '，已會' : '，還不熟') : ''));
    gridEl.appendChild(b);
  })(i);
  $('search').value = ''; filterPicker('');
  pickerEl.hidden = false; document.body.style.overflow = 'hidden'; pickerEl.scrollTop = 0;
}
function closePicker() { pickerEl.hidden = true; document.body.style.overflow = ''; }
function filterPicker(q) {
  q = q.trim().toLowerCase();
  gridEl.hidden = !!q; rowsEl.hidden = !q; rowsEl.innerHTML = '';
  var n = 0;
  if (q) D.forEach(function (d, i) {
    if (d.e.toLowerCase().indexOf(q) < 0 && d.z.indexOf(q) < 0) return;
    n++;
    var li = el('li'), b = btn('', '', function () { closePicker(); S.review = false; paintReview(); go(i); });
    b.appendChild(el('span', 'n', String(i + 1))); b.appendChild(el('span', 't', d.e)); li.appendChild(b); rowsEl.appendChild(li);
  });
  $('empty').hidden = !q || n > 0;
}

/* ---------- 控制 ---------- */
$('prev').addEventListener('click', function () { stepTo(-1); });
$('next').addEventListener('click', function () { stepTo(1); });
$('pos').addEventListener('click', openPicker);
$('pclose').addEventListener('click', closePicker);
$('search').addEventListener('input', function () { filterPicker(this.value); });
$('stages').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var s = parseInt(b.getAttribute('data-s'), 10); if (s === S.stage) return;
  stopChain(); S.stage = s; render(); hideTip();
});
$('play').addEventListener('click', function () {
  if (S.playing) { stopChain(); return; }
  S.chain = ['a', 'b']; playClip(S.idx, '');
});
$('gender').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  S.gender = b.getAttribute('data-g'); S.turn = 'f'; paintSeg('gender', 'data-g', S.gender); persist(); prefetchSentence(S.idx);
});
$('spd').addEventListener('click', function () {
  S.rate = SPEEDS[(SPEEDS.indexOf(S.rate) + 1) % SPEEDS.length]; au.playbackRate = S.rate; paintSpd(); persist();
});
function paintSpd() { $('spd').textContent = S.rate.toFixed(1) + '×'; $('spd').setAttribute('aria-label', '語速 ' + S.rate.toFixed(1) + ' 倍，點一下切換'); }
function paintSeg(id, attr, val) {
  Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) { b.setAttribute('aria-checked', String(b.getAttribute(attr) === val)); });
}
$('gap').addEventListener('change', function () { S.gap = parseFloat(this.value); persist(); });
$('zh').addEventListener('change', function () { S.zh = this.checked; document.body.classList.toggle('nozh', !S.zh); persist(); });
$('ck').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  S.ck = b.getAttribute('data-c'); paintSeg('ck', 'data-c', S.ck); applyCk(); persist();
});
function applyCk() { document.body.classList.remove('ck-ul', 'ck-color', 'ck-off'); document.body.classList.add('ck-' + S.ck); }
$('review').addEventListener('click', function () {
  stopChain();
  if (!S.review) {
    var dl = dueList();
    if (!dl.length) { note('目前沒有待複習的句子。', 2500); return; }
    S.review = true; if (!due(S.idx)) { go(dl[0]); }
  } else S.review = false;
  paintReview();
});
$('dlAll').addEventListener('click', function () {
  var btnEl = this, msg = $('dlMsg');
  if (!window.caches) { msg.textContent = '這個瀏覽器不支援離線儲存，音檔會每次從網路播放。'; return; }
  btnEl.disabled = true;
  var urls = [];
  for (var i = 0; i < D.length; i++) ['f', 'm'].forEach(function (p) { ['', 'a', 'b'].forEach(function (g) { urls.push(clipURL(i, p, g)); }); });
  var done = 0, fail = 0, next = 0;
  function show() { msg.textContent = '下載中… ' + (done + fail) + ' / ' + urls.length + (fail ? '（失敗 ' + fail + '）' : ''); }
  function worker() {
    if (next >= urls.length) return Promise.resolve();
    var u = urls[next++];
    return loadClip(u).then(function (b) { URL.revokeObjectURL(b); done++; }, function () { fail++; }).then(function () { show(); return worker(); });
  }
  show();
  Promise.all([worker(), worker(), worker(), worker()]).then(function () {
    btnEl.disabled = false;
    msg.textContent = fail ? '有 ' + fail + ' 個音檔沒下載成功，請確認網路後再按一次。' : '全部音檔已存在這台裝置，之後不用再下載。';
  });
});
$('clear').addEventListener('click', function () {
  if (!window.confirm('確定要清除這台裝置上所有句子的學習紀錄嗎？')) return;
  P = {}; persistP(); S.review = false; paintSum(); paintReview();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pickerEl.hidden) closePicker(); });

/* ---------- 初始化 ---------- */
$('gap').value = String(S.gap); $('zh').checked = S.zh; document.body.classList.toggle('nozh', !S.zh);
paintSeg('gender', 'data-g', S.gender); paintSeg('ck', 'data-c', S.ck); paintSpd(); applyCk();
render(); paintNav(); paintSum(); paintReview(); prefetchSentence(S.idx); prefetchSentence(S.idx + 1);
window.addEventListener('pagehide', function () { try { au.pause(); } catch (e) {} });
window.__app = { S: S, D: D, exParts: exParts, origParts: origParts, due: due, go: go };
})();
</script>
